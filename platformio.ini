[platformio]
default_envs = esp32-s3
# Keep the toolchain cache inside the ignored project build directory.
core_dir = .pio/core

[env]
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
board_build.filesystem = littlefs
board_build.arduino.memory_type = qio_opi
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    -D CORE_DEBUG_LEVEL=3
lib_deps =
    bitbank2/JPEGDEC@^1.8.1

# Existing ESP32-S3 breakout plus 7.3-inch HAT (E).
[env:esp32-s3]
platform = espressif32@6.12.0
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_src_filter = +<*> -<Epaper13in3e.cpp>

# Integrated Waveshare ESP32-S3-ePaper-13.3E6, WROOM-2-N32R16V.
# The connected board reports octal flash: use OPI flash and OPI PSRAM.
[env:esp32-s3-13in3e6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board_upload.flash_size = 32MB
board_upload.maximum_size = 4194304
board_build.flash_mode = opi
board_build.arduino.memory_type = opi_opi
board_build.partitions = partitions_32mb.csv
build_flags =
    ${env.build_flags}
    -D BIRDDISPLAY_PANEL_13IN3E6=1
build_src_filter = +<*> -<Epaper7in3e.cpp>
